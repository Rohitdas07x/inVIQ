[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider
asyncio_mode = auto
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks tests as isolated unit tests
    integration: marks tests as cross-service integration tests
    api: marks tests as REST/GraphQL/WebSocket API tests
    e2e: marks tests as end-to-end full workflow tests
    smoke: marks fast sanity check tests for CI gating
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
